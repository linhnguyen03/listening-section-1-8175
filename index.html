<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocabulary: Reprinting a Hotel Brochure (Band 5.5)</title>
<style>
  :root{
    --primary:#5b6fd8;
    --primary-dark:#4457c0;
    --accent:#ff8a65;
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#2b2d42;
    --muted:#6b7280;
    --good:#2e7d32;
    --bad:#c62828;
    --border:#e2e5ef;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    margin:0;
    padding:0;
    color:var(--text);
  }
  header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:28px 20px 20px;
    text-align:center;
  }
  header h1{margin:0 0 6px;font-size:1.5rem;}
  header p{margin:0;opacity:0.9;font-size:0.95rem;}
  .container{max-width:780px;margin:0 auto;padding:20px;}
  .tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:20px auto 0;
    max-width:780px;
    padding:0 20px;
  }
  .tab-btn{
    flex:1;
    padding:12px 8px;
    border:none;
    border-radius:10px 10px 0 0;
    background:#e5e8f5;
    color:var(--primary-dark);
    font-weight:600;
    cursor:pointer;
    font-size:0.95rem;
    transition:0.2s;
  }
  .tab-btn.active{
    background:var(--card);
    color:var(--primary);
    box-shadow:0 -2px 8px rgba(0,0,0,0.05);
  }
  .panel{display:none;background:var(--card);border-radius:0 0 14px 14px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,0.06);}
  .panel.active{display:block;}

  /* Glossary */
  .word-card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .word-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .word-title h3{margin:0;color:var(--primary-dark);font-size:1.15rem;}
  .ipa{color:var(--muted);font-size:0.95rem;}
  .pos{
    font-size:0.75rem;
    background:#eef0fa;
    color:var(--primary-dark);
    padding:2px 8px;
    border-radius:20px;
    font-style:italic;
  }
  .def{margin:8px 0 4px;}
  .example{color:var(--muted);font-style:italic;font-size:0.92rem;}
  .vi{color:#a9afc3;font-size:0.88rem;margin:2px 0 0;}

  /* Flashcards */
  .flash-wrap{display:flex;flex-direction:column;align-items:center;}
  .flashcard{
    width:100%;
    max-width:420px;
    height:220px;
    perspective:1000px;
    margin:10px auto 18px;
  }
  .flash-inner{
    position:relative;
    width:100%;height:100%;
    text-align:center;
    transition:transform 0.5s;
    transform-style:preserve-3d;
    cursor:pointer;
  }
  .flash-inner.flipped{transform:rotateY(180deg);}
  .flash-face{
    position:absolute;width:100%;height:100%;
    backface-visibility:hidden;
    border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;
    box-shadow:0 4px 14px rgba(0,0,0,0.1);
  }
  .flash-front{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;}
  .flash-back{background:#fff8f2;border:2px solid var(--accent);transform:rotateY(180deg);}
  .flash-front h2{font-size:1.6rem;margin:0 0 6px;}
  .flash-back p{margin:6px 0;}
  .flash-nav{display:flex;gap:14px;align-items:center;margin-top:6px;}
  .nav-btn{
    background:var(--primary);color:#fff;border:none;border-radius:8px;
    padding:8px 16px;cursor:pointer;font-size:0.9rem;
  }
  .nav-btn:hover{background:var(--primary-dark);}
  .flash-counter{color:var(--muted);font-size:0.9rem;}

  /* Quiz */
  .quiz-progress{color:var(--muted);font-size:0.9rem;margin-bottom:10px;}
  .quiz-q{font-size:1.05rem;font-weight:600;margin-bottom:14px;}
  .quiz-options{display:flex;flex-direction:column;gap:10px;}
  .option-btn{
    text-align:left;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fafbff;
    cursor:pointer;
    font-size:0.95rem;
  }
  .option-btn:hover{border-color:var(--primary);}
  .option-btn.correct{background:#e8f5e9;border-color:var(--good);color:var(--good);font-weight:600;}
  .option-btn.incorrect{background:#fdecea;border-color:var(--bad);color:var(--bad);font-weight:600;}
  .option-btn[disabled]{cursor:default;}
  .quiz-feedback{margin-top:14px;font-size:0.9rem;min-height:20px;}
  .quiz-actions{margin-top:16px;display:flex;justify-content:space-between;align-items:center;}
  .score-box{
    text-align:center;padding:30px 10px;
  }
  .score-box h2{color:var(--primary-dark);}
  .restart-btn{
    background:var(--accent);color:#fff;border:none;padding:10px 20px;
    border-radius:8px;cursor:pointer;font-size:0.95rem;margin-top:10px;
  }
</style>
</head>
<body>

<header>
  <h1>📄 Reprinting a Hotel Brochure</h1>
  <p>Vocabulary Practice — Band 5.5</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('glossary')">Glossary</button>
  <button class="tab-btn" onclick="showTab('flashcards')">Flashcards</button>
  <button class="tab-btn" onclick="showTab('quiz')">Quiz</button>
</div>

<div class="container">

  <!-- GLOSSARY -->
  <div id="glossary" class="panel active"></div>

  <!-- FLASHCARDS -->
  <div id="flashcards" class="panel">
    <div class="flash-wrap">
      <div class="flashcard">
        <div class="flash-inner" id="flashInner" onclick="flipCard()">
          <div class="flash-face flash-front" id="flashFront"></div>
          <div class="flash-face flash-back" id="flashBack"></div>
        </div>
      </div>
      <div class="flash-nav">
        <button class="nav-btn" onclick="prevCard()">◀ Prev</button>
        <span class="flash-counter" id="flashCounter"></span>
        <button class="nav-btn" onclick="nextCard()">Next ▶</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="panel">
    <div id="quizArea"></div>
  </div>

</div>

<script>
const vocab = [
  {
    word: "reprint",
    ipa: "/ˌriːˈprɪnt/",
    pos: "verb",
    def: "to print something again, usually with some changes.",
    example: "We need to reprint the brochure because the prices have changed.",
    vi: "in lại"
  },
  {
    word: "revise",
    ipa: "/rɪˈvaɪz/",
    pos: "verb",
    def: "to change or correct something in order to improve it.",
    example: "There are some pages that need revising before we print them.",
    vi: "sửa đổi, chỉnh sửa"
  },
  {
    word: "out-of-date",
    ipa: "/ˌaʊt əv ˈdeɪt/",
    pos: "adjective",
    def: "old and no longer accurate, useful, or fashionable.",
    example: "Some of the information in the brochure is already out-of-date.",
    vi: "lỗi thời, đã cũ"
  },
  {
    word: "layout",
    ipa: "/ˈleɪaʊt/",
    pos: "noun",
    def: "the way that text, pictures, etc. are arranged on a page.",
    example: "There are a couple of problems with the layout of the brochure.",
    vi: "bố cục"
  },
  {
    word: "glance",
    ipa: "/ɡlɑːns/",
    pos: "verb",
    def: "to look at something quickly.",
    example: "The address is hard to see when you glance at the cover.",
    vi: "liếc nhìn, nhìn lướt qua"
  },
  {
    word: "renovation",
    ipa: "/ˌrenəˈveɪʃn/",
    pos: "noun",
    def: "the process of repairing or improving a building so it is in good condition again.",
    example: "The pool is currently under renovation and is not available.",
    vi: "việc cải tạo, tu sửa"
  },
  {
    word: "description",
    ipa: "/dɪˈskrɪpʃn/",
    pos: "noun",
    def: "a piece of writing that says what someone or something is like.",
    example: "All the descriptions of the pool should be removed from page 2.",
    vi: "phần mô tả"
  },
  {
    word: "enclosed",
    ipa: "/ɪnˈkləʊzd/",
    pos: "adjective",
    def: "sent or included together with something else, such as a letter or file.",
    example: "The original photo is enclosed in the flash drive.",
    vi: "được đính kèm"
  },
  {
    word: "represent",
    ipa: "/ˌreprɪˈzent/",
    pos: "verb",
    def: "to show or be a sign of something.",
    example: "One picture does not fully represent the appeal of the hotel.",
    vi: "thể hiện, đại diện cho"
  },
  {
    word: "appeal",
    ipa: "/əˈpiːl/",
    pos: "noun",
    def: "a quality that makes something attractive or interesting.",
    example: "The photos should show the full appeal of the hotel.",
    vi: "sức hấp dẫn"
  },
  {
    word: "exterior",
    ipa: "/ɪkˈstɪəriə(r)/",
    pos: "noun",
    def: "the outside part or surface of something.",
    example: "The brochure shows a picture of the hotel's exterior.",
    vi: "bên ngoài, ngoại thất"
  },
  {
    word: "interior",
    ipa: "/ɪnˈtɪəriə(r)/",
    pos: "noun",
    def: "the inside part of something, such as a building.",
    example: "There is also a photo of the hotel's interior decoration.",
    vi: "bên trong, nội thất"
  },
  {
    word: "stand out",
    ipa: "/ˌstænd ˈaʊt/",
    pos: "phrasal verb",
    def: "to be easily noticed because of being different or clear.",
    example: "The prices need to be red so that they stand out on the page.",
    vi: "nổi bật"
  },
  {
    word: "translate",
    ipa: "/trænsˈleɪt/",
    pos: "verb",
    def: "to change words from one language into another.",
    example: "Could you translate the whole brochure into Spanish?",
    vi: "dịch (ngôn ngữ)"
  },
  {
    word: "deadline",
    ipa: "/ˈdedlaɪn/",
    pos: "noun",
    def: "the latest time or date by which something must be finished.",
    example: "We need the brochure ready before the deadline at the end of July.",
    vi: "hạn chót"
  },
  {
    word: "sample",
    ipa: "/ˈsɑːmpl/",
    pos: "noun",
    def: "an example of something that shows what the rest is like.",
    example: "I've got samples of the previous version of the brochure.",
    vi: "mẫu"
  },
  {
    word: "address",
    ipa: "/əˈdres/",
    pos: "verb",
    def: "to call or refer to someone by a particular name or title.",
    example: "Sure, how may I address you?",
    vi: "xưng hô, gọi tên"
  }
];

/* ---------- GLOSSARY ---------- */
function buildGlossary(){
  const container = document.getElementById('glossary');
  container.innerHTML = vocab.map(v => `
    <div class="word-card">
      <div class="word-title">
        <h3>${v.word}</h3>
        <span class="ipa">${v.ipa}</span>
        <span class="pos">${v.pos}</span>
      </div>
      <p class="def">${v.def}</p>
      <p class="vi">${v.vi}</p>
      <p class="example">"${v.example}"</p>
    </div>
  `).join('');
}

/* ---------- TABS ---------- */
function showTab(id){
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if(id === 'flashcards') renderFlashcard();
  if(id === 'quiz') initQuiz();
}

/* ---------- FLASHCARDS ---------- */
let flashIndex = 0;
let flipped = false;

function renderFlashcard(){
  const v = vocab[flashIndex];
  document.getElementById('flashFront').innerHTML = `<h2>${v.word}</h2><div>${v.ipa}</div><div class="pos" style="margin-top:8px;background:rgba(255,255,255,0.25);color:#fff;">${v.pos}</div>`;
  document.getElementById('flashBack').innerHTML = `<p class="example">"${v.example}"</p>`;
  document.getElementById('flashCounter').textContent = `${flashIndex + 1} / ${vocab.length}`;
  document.getElementById('flashInner').classList.remove('flipped');
  flipped = false;
}
function flipCard(){
  flipped = !flipped;
  document.getElementById('flashInner').classList.toggle('flipped', flipped);
}
function nextCard(){
  flashIndex = (flashIndex + 1) % vocab.length;
  renderFlashcard();
}
function prevCard(){
  flashIndex = (flashIndex - 1 + vocab.length) % vocab.length;
  renderFlashcard();
}

/* ---------- QUIZ ---------- */
// Verified fill-in-the-blank sentences: each blank has exactly one correct vocab match.
const quizData = [
  { sentence: "Some of the information in the brochure is already ______, so it needs updating.", answer: "out-of-date" },
  { sentence: "There are a couple of problems with the ______ of the front page.", answer: "layout" },
  { sentence: "It's hard to see the address when you ______ at the cover quickly.", answer: "glance" },
  { sentence: "The pool is under ______, so it can't be shown as open in the brochure.", answer: "renovation" },
  { sentence: "All the ______ of the pool should be removed from page 2.", answer: "description" },
  { sentence: "The original photo is ______ in the flash drive she brought.", answer: "enclosed" },
  { sentence: "A single photo does not fully ______ the appeal of the hotel.", answer: "represent" },
  { sentence: "They want photos that better show the ______ of the hotel to guests.", answer: "appeal" },
  { sentence: "The picture on page 5 originally showed the hotel's ______ view.", answer: "exterior" },
  { sentence: "It also showed the ______ decoration of the hotel's rooms.", answer: "interior" },
  { sentence: "The prices should be printed in red so that they ______ on the page.", answer: "stand out" },
  { sentence: "Could you ______ the whole brochure into Spanish for our customers?", answer: "translate" },
  { sentence: "The revised brochure must be ready before the ______ at the end of July.", answer: "deadline" },
  { sentence: "She brought ______ of the previous version of the brochure.", answer: "sample" },
  { sentence: "\"Sure, how may I ______ you?\" asked the printer politely.", answer: "address" },
  { sentence: "Once all the changes were confirmed, the printer agreed to ______ a new batch of the brochure.", answer: "reprint" },
  { sentence: "There are some pages that we need to ______ before they go to print.", answer: "revise" }
];

let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQuiz(){
  quizOrder = shuffle(quizData);
  quizIndex = 0;
  quizScore = 0;
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const area = document.getElementById('quizArea');
  if(quizIndex >= quizOrder.length){
    area.innerHTML = `
      <div class="score-box">
        <h2>Quiz Complete! 🎉</h2>
        <p>Your score: <strong>${quizScore} / ${quizOrder.length}</strong></p>
        <button class="restart-btn" onclick="initQuiz()">Try Again</button>
      </div>`;
    return;
  }

  const q = quizOrder[quizIndex];
  // build 3 distractors + correct answer, shuffled
  const distractors = shuffle(vocab.filter(v => v.word !== q.answer)).slice(0, 3).map(v => v.word);
  const options = shuffle([q.answer, ...distractors]);

  area.innerHTML = `
    <div class="quiz-progress">Question ${quizIndex + 1} of ${quizOrder.length} &nbsp;|&nbsp; Score: ${quizScore}</div>
    <div class="quiz-q">${q.sentence}</div>
    <div class="quiz-options" id="quizOptions">
      ${options.map(opt => `<button class="option-btn" data-word="${opt}" onclick="checkAnswer(this, '${q.answer}')">${opt}</button>`).join('')}
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="quiz-actions">
      <button class="nav-btn" id="nextQBtn" style="display:none;" onclick="nextQuestion()">Next Question ▶</button>
    </div>
  `;
}

function checkAnswer(btn, correctAnswer){
  const buttons = document.querySelectorAll('#quizOptions .option-btn');
  buttons.forEach(b => b.disabled = true);
  const chosen = btn.getAttribute('data-word');
  const feedback = document.getElementById('quizFeedback');

  if(chosen === correctAnswer){
    btn.classList.add('correct');
    feedback.textContent = "✅ Correct!";
    feedback.style.color = "#2e7d32";
    quizScore++;
  } else {
    btn.classList.add('incorrect');
    feedback.textContent = `❌ Not quite. The correct answer is "${correctAnswer}".`;
    feedback.style.color = "#c62828";
    buttons.forEach(b => {
      if(b.getAttribute('data-word') === correctAnswer) b.classList.add('correct');
    });
  }
  document.getElementById('nextQBtn').style.display = 'inline-block';
}

function nextQuestion(){
  quizIndex++;
  renderQuizQuestion();
}

/* ---------- INIT ---------- */
buildGlossary();
renderFlashcard();
</script>

</body>
</html>
